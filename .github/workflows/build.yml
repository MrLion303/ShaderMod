name: Build Forge Mod

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Dar permisos a Gradle
        run: chmod +x gradlew
      - name: Validar shader GLSL
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools
          glslangValidator -S frag src/main/resources/assets/shaders/shaders/program/negativestudios_effects.fsh
      - name: Compilar
        run: ./gradlew build --no-daemon
      - name: Subir jar
        uses: actions/upload-artifact@v4
        with:
          name: ShaderMod-Forge-1.20.1
          path: build/libs/*.jar
