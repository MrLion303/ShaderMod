plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'eclipse'
    id 'maven-publish'
}

version = '1.1.2'
group = 'net.negativestudios.shaders'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
}

repositories { }

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
}

tasks.named('jar', Jar).configure {
    archiveBaseName = 'ShaderMod'
    finalizedBy 'reobfJar'
}

jar {
    manifest {
        attributes([
            'Specification-Title': 'Shaders NegativeStudios',
            'Specification-Vendor': 'NegativeStudios',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'NegativeStudios'
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven { url = layout.buildDirectory.dir('repo') }
    }
}


// Generate a native-size effect icon from the artwork kept in the resource-pack folder.
tasks.named('processResources') {
    doLast {
        def mobEffectDir = file("${buildDir}/resources/main/assets/shaders/textures/mob_effect")
        mobEffectDir.mkdirs()

        def logoSource = file('logo.png')
        if (!logoSource.isFile()) {
            throw new GradleException("No se encontró el icono de ShaderMod: ${logoSource}")
        }

        def sourceImage = javax.imageio.ImageIO.read(logoSource)
        if (sourceImage == null) {
            throw new GradleException("El archivo de icono no es una imagen PNG válida: ${logoSource}")
        }

        // A 36 px source texture stays crisp in the 18 x 18 status-effect slot.
        def iconSize = 36
        def iconImage = new java.awt.image.BufferedImage(
            iconSize, iconSize, java.awt.image.BufferedImage.TYPE_INT_ARGB
        )
        def graphics = iconImage.createGraphics()
        graphics.setRenderingHint(
            java.awt.RenderingHints.KEY_INTERPOLATION,
            java.awt.RenderingHints.VALUE_INTERPOLATION_BICUBIC
        )
        graphics.setRenderingHint(
            java.awt.RenderingHints.KEY_RENDERING,
            java.awt.RenderingHints.VALUE_RENDER_QUALITY
        )
        graphics.drawImage(sourceImage, 0, 0, iconSize, iconSize, null)
        graphics.dispose()

        javax.imageio.ImageIO.write(
            iconImage, 'png',
            new File(mobEffectDir, 'logo.png')
        )
        // Preserve the previous alias so any resource-pack or external reference keeps working.
        javax.imageio.ImageIO.write(
            iconImage, 'png',
            new File(mobEffectDir, 'shaderlogo.png')
        )

        // Keep the named effect textures available for pack/resource compatibility.
        def effectIconNames = [
            'fxaa', 'art', 'bumpy', 'blobs2', 'color_convolve', 'deconverge',
            'ntsc', 'outline', 'phosphor', 'bits', 'green', 'blobs', 'antialias',
            'flip', 'pencil', 'enderman_vision', 'sobel', 'desaturate', 'blur',
            'wobble', 'creeper_vision', 'spider_vision', 'scan_pincushion',
            'notch', 'nada'
        ]
        effectIconNames.each { iconName ->
            javax.imageio.ImageIO.write(
                iconImage, 'png',
                new File(mobEffectDir, iconName + '.png')
            )
        }
    }
}
