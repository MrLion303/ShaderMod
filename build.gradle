plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'eclipse'
    id 'maven-publish'
}

version = '1.1.2'
group = 'net.negativestudios.shaders'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
}

repositories { }

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
}

tasks.named('jar', Jar).configure {
    archiveBaseName = 'ShaderMod'
    finalizedBy 'reobfJar'
}

jar {
    manifest {
        attributes([
            'Specification-Title': 'Shaders NegativeStudios',
            'Specification-Vendor': 'NegativeStudios',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'NegativeStudios'
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven { url = layout.buildDirectory.dir('repo') }
    }
}


// Copy the shared mod logo and shader effect icon into the resource tree at build time.
// The source PNGs remain in the repository root so they are easy to replace.
tasks.named('processResources') {
    doLast {
        def mobEffectDir = file("${buildDir}/resources/main/assets/shaders/textures/mob_effect")
        mobEffectDir.mkdirs()

        copy {
            from file('logo.png')
            into mobEffectDir
            rename { 'logo.png' }
        }

        copy {
            from file('logo.png')
            into mobEffectDir
            rename { 'shaderlogo.png' }
        }

        def effectIconNames = [
            'fxaa', 'art', 'bumpy', 'blobs2', 'color_convolve', 'deconverge',
            'ntsc', 'outline', 'phosphor', 'bits', 'green', 'blobs', 'antialias',
            'flip', 'pencil', 'enderman_vision', 'sobel', 'desaturate', 'blur',
            'wobble', 'creeper_vision', 'spider_vision', 'scan_pincushion',
            'notch', 'nada'
        ]

        effectIconNames.each { iconName ->
            copy {
                from file('shaderlogo.png')
                into mobEffectDir
                rename { name -> iconName + '.png' }
            }
        }
    }
}
