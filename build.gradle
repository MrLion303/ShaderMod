plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'eclipse'
    id 'maven-publish'
}

version = '1.1.0'
group = 'net.negativestudios.shaders'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
}

repositories { }

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
}

tasks.named('jar', Jar).configure {
    archiveBaseName = 'ShaderMod'
    finalizedBy 'reobfJar'
}

jar {
    manifest {
        attributes([
            'Specification-Title': 'Shaders NegativeStudios',
            'Specification-Vendor': 'NegativeStudios',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'NegativeStudios'
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven { url = layout.buildDirectory.dir('repo') }
    }
}
